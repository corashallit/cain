<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=900">
<title>CAIN — Registered Exorcist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  CAIN interactive exorcist sheet, built on CAINsheets_1.4.5.pdf.

  Each page's printed art is one full-page render (assets/art/page-N.webp, made by
  ../render-sheet-pages.py), so nothing on the official sheet is cropped or retyped.
  Everything below the art is an interactive overlay, positioned in CSS px on the
  850x1100 sheet (PDF points x 850/612). Positions were measured from the PDF's own
  object bounds and from the renders; after rendering a new PDF version, screenshot
  the sheet and re-measure anything that moved.

  Conventions (app.js owns all behaviour):
    .ce.line / .ce.area  contenteditable text, saved under data-key
    .ac[data-ac]         agenda / blasphemy names with autocomplete
    .dot / .tick         toggles (dot fills black, tick gets a red X)
    .dotrow              data-count dots; data-xs lists each dot's centre x on the sheet,
                         the row's top is the dots' top. The value is the filled count.
    .sindot              sin boxes; right-click crosses one out for good
  Every key is unchanged from the first version of the sheet, so saves carry over.
-->
<style>
  /* ---------- page 1 ---------- */
  #page1 .cf { font-size:15px; line-height:16px; height:17px; }
  #page1 .cf.ac { font-size:13px; line-height:14px; height:14px; }
  #page1 #idphoto { left:78px; top:86px; width:145px; height:181px; }
  #page1 #idcat   { left:378px; top:90px; width:65px; height:65px; font-size:34px; }
  #page1 #exec-hit { left:22px; top:334px; width:441px; height:47px; }
  #page1 #exec-talisman { left:83px; top:341px; width:26px; height:25px; }
  #page1 .inj { --dot:25px; top:462.5px; }
  #page1 .hookname { font-size:11px; line-height:13px; height:14px; top:581px; }
  #page1 .htick { position:absolute; }
  #page1 #afflictions { left:90px; top:782px; width:346px; height:212px; font-size:14px; }
  #page1 .sk { --dot:19px; }
  #page1 .pathos { --dot:18px; }
  #page1 .adv { --dot:20.5px; }

  /* ---------- page 2 ---------- */
  #page2 .cat-hot { top:42px; width:62px; height:56px; }
  #page2 #psyche-dots { --dot:46px; top:141.5px; }
  #page2 #burst-dots  { --dot:25px; top:165.5px; }
  #page2 .sindot { --dot:21.5px; }
  #page2 #kp-dots { --dot:20px; top:299.7px; }
  #page2 #kit-list { left:80px; top:390px; width:338px; height:424px; font-size:13px; line-height:1.5; }
  #page2 #scrip { left:226px; top:843px; width:190px; font-size:20px; line-height:22px; height:23px;
        border-bottom:1.5px solid rgba(60,60,56,.28); }
  #page2 .mark { font-size:15px; padding:12px 16px 22px; }
  #page2 #mark-worm { left:467px; top:728px; width:361px; height:158px; border-radius:22px; }
  #page2 #mark-bee  { left:44px;  top:934px; width:391px; height:158px; border-radius:22px; }
  #page2 #mark-fly  { left:448px; top:925px; width:361px; height:158px; border-radius:22px; }

  /* ---------- page 3 ---------- */
  #page3 .ac { position:absolute; font-family:var(--f-hand); color:var(--hand-ink); outline:none;
        cursor:text; white-space:nowrap; overflow:hidden; display:flex; align-items:center; }
  #page3 #f-agenda    { left:216px; top:84px;  width:216px; height:43px; font-size:20px; }
  #page3 #f-blasphemy { left:278px; top:388px; width:262px; height:57px; font-size:24px; }
  #page3 .box { font-size:15px; }
  #page3 #b-items     { left:68px;  top:202px; width:310px; height:154px; }
  #page3 #b-abilities { left:442px; top:142px; width:344px; height:202px; }
  #page3 #b-passive   { left:62px;  top:526px; width:222px; height:94px; }
  #page3 #b-p1 { left:443px; top:478px; width:325px; height:140px; }
  #page3 #b-p2 { left:62px;  top:656px; width:325px; height:160px; }
  #page3 #b-p3 { left:441px; top:655px; width:325px; height:160px; }
  #page3 #b-p4 { left:65px;  top:859px; width:325px; height:160px; }
  #page3 #b-p5 { left:444px; top:858px; width:325px; height:160px; }
  #page3 .tcell { position:absolute; top:584.3px; height:35px; }

  /* ---------- page 4 (CAT reference; the chosen CAT's column is outlined) ---------- */
  #page4 #cat-col { top:145px; width:85px; height:681px; display:none; pointer-events:none;
        border:2.5px solid rgba(184,22,12,.8); background:rgba(200,26,16,.06); }
</style>

<!-- ===================== PAGE 1 ===================== -->
<section class="sheet" id="page1">
  <img class="page-art" src="assets/art/page-1.webp" alt="Exorcist sheet page 1: ID card, execution, health evaluation form, skills, action assessment, divine agony, advancement">

  <!-- ID card -->
  <div id="idphoto" class="a"></div>
  <div id="idcat" class="a"></div>
  <span class="cf ce line a" data-key="p1.name"  style="left:245px;top:110px;width:122px"></span>
  <span class="cf ce line a" data-key="p1.xid"   style="left:280px;top:141px;width:78px"></span>
  <span class="cf ce line ac ac-plain a" data-key="p1.agnd"  data-ac="agenda"    style="left:278px;top:181px;width:120px"></span>
  <span class="cf ce line ac ac-plain a" data-key="p1.blsph" data-ac="blasphemy" style="left:281px;top:195px;width:117px"></span>
  <span class="cf ce line a" data-key="p1.sx"    style="left:262px;top:217px;width:84px"></span>
  <span class="cf ce line a" data-key="p1.ht"    style="left:262px;top:231px;width:84px"></span>
  <span class="cf ce line a" data-key="p1.wt"    style="left:262px;top:246px;width:96px"></span>
  <span class="cf ce line a" data-key="p1.hair"  style="left:392px;top:217px;width:74px"></span>
  <span class="cf ce line a" data-key="p1.eyes"  style="left:392px;top:231px;width:74px"></span>
  <span class="cf ce line a" data-key="p1.cid"   style="left:252px;top:292px;width:92px"></span>

  <!-- execution: click the strip to carve a slash; the printed circle shows the count -->
  <div id="exec-hit" class="a"></div>
  <div id="exec-talisman" class="a"></div>

  <!-- injuries, then the visitation-rights box -->
  <span class="dot bare inj a" data-key="p1.inj.1" style="left:253.6px"></span>
  <span class="dot bare inj a" data-key="p1.inj.2" style="left:315.4px"></span>
  <span class="dot bare inj a" data-key="p1.inj.3" style="left:377.1px"></span>
  <span class="dot bare inj a" data-key="p1.inj.visit" style="left:253.6px;top:527.7px"></span>

  <!-- hooks: a name over each printed line, three slash cells per box -->
  <span class="hookname ce line a" data-key="p1.hook.1.name" style="left:246px;width:48px"></span>
  <span class="hookname ce line a" data-key="p1.hook.2.name" style="left:322px;width:49px"></span>
  <span class="hookname ce line a" data-key="p1.hook.3.name" style="left:385px;width:55px"></span>
  <span class="tick bare htick" data-key="p1.hook.1.t1" style="left:253px;top:602.5px;width:36.8px;height:37.7px"></span>
  <span class="tick bare htick" data-key="p1.hook.1.t2" style="left:253px;top:640.2px;width:36.8px;height:37.3px"></span>
  <span class="tick bare htick" data-key="p1.hook.1.t3" style="left:253px;top:677.5px;width:36.8px;height:35.2px"></span>
  <span class="tick bare htick" data-key="p1.hook.2.t1" style="left:326.9px;top:602.5px;width:33.3px;height:37.7px"></span>
  <span class="tick bare htick" data-key="p1.hook.2.t2" style="left:326.9px;top:640.2px;width:33.3px;height:37.3px"></span>
  <span class="tick bare htick" data-key="p1.hook.2.t3" style="left:326.9px;top:677.5px;width:33.3px;height:35.2px"></span>
  <span class="tick bare htick" data-key="p1.hook.3.t1" style="left:397.2px;top:602.5px;width:35.2px;height:37.7px"></span>
  <span class="tick bare htick" data-key="p1.hook.3.t2" style="left:397.2px;top:640.2px;width:35.2px;height:37.3px"></span>
  <span class="tick bare htick" data-key="p1.hook.3.t3" style="left:397.2px;top:677.5px;width:35.2px;height:35.2px"></span>

  <div id="afflictions" class="ce area a" data-key="p1.afflictions"></div>

  <!-- registered skills: one row per skill, three dots each -->
  <div class="dotrow baredots sk a" data-key="p1.sk.force"         data-count="3" data-xs="708.7,739.8,771.2" style="top:87px"></div>
  <div class="dotrow baredots sk a" data-key="p1.sk.conditioning"  data-count="3" data-xs="708.7,739.8,771.2" style="top:119px"></div>
  <div class="dotrow baredots sk a" data-key="p1.sk.coordination"  data-count="3" data-xs="708.7,739.8,771.2" style="top:151.2px"></div>
  <div class="dotrow baredots sk a" data-key="p1.sk.covert"        data-count="3" data-xs="708.7,739.8,771.2" style="top:182.7px"></div>
  <div class="dotrow baredots sk a" data-key="p1.sk.interfacing"   data-count="3" data-xs="708.7,739.8,771.2" style="top:215.5px"></div>
  <div class="dotrow baredots sk a" data-key="p1.sk.investigation" data-count="3" data-xs="708.7,739.8,771.2" style="top:247.3px"></div>
  <div class="dotrow baredots sk a" data-key="p1.sk.surveillance"  data-count="3" data-xs="708.7,739.8,771.2" style="top:281.2px"></div>
  <div class="dotrow baredots sk a" data-key="p1.sk.negotiation"   data-count="3" data-xs="708.7,739.8,771.2" style="top:313.2px"></div>
  <div class="dotrow baredots sk a" data-key="p1.sk.authority"     data-count="3" data-xs="708.7,739.8,771.2" style="top:343.5px"></div>
  <div class="dotrow baredots sk a" data-key="p1.sk.connection"    data-count="3" data-xs="708.7,739.8,771.2" style="top:375.2px"></div>
  <div class="dotrow baredots sk a" data-key="p1.improve" data-count="6" data-xs="577.6,609.3,640.5,668.9,700.5,731.8" style="top:460.4px"></div>

  <!-- pathos: a dot inside each printed star -->
  <span class="dot bare pathos a" data-key="p1.pathos.1" style="left:746.7px;top:752.2px"></span>
  <span class="dot bare pathos a" data-key="p1.pathos.2" style="left:726px;top:787.8px"></span>
  <span class="dot bare pathos a" data-key="p1.pathos.3" style="left:767.7px;top:788px"></span>

  <!-- advancement -->
  <div class="dotrow baredots adv a" data-key="p1.xp"  data-count="8" data-dashed-from="5" data-xs="579.3,607.6,636.3,663.2,693,722.3,750,779.3" style="top:903px"></div>
  <div class="dotrow baredots adv a" data-key="p1.adv" data-count="3" data-xs="648.5,675.2,702.2" style="top:929.3px"></div>
</section>

<!-- ===================== PAGE 2 ===================== -->
<section class="sheet" id="page2">
  <img class="page-art" src="assets/art/page-2.webp" alt="Exorcist sheet page 2: category, psyche, burst, registered kit, sin, sin overflow, sin marks">

  <!-- CAT: click a triangle to circle it (shared x.cat, also shown on the ID card and page 4) -->
  <span class="cat-hot" data-cat="1" style="left:226.8px"></span>
  <span class="cat-hot" data-cat="2" style="left:296.8px"></span>
  <span class="cat-hot" data-cat="3" style="left:366.3px"></span>
  <span class="cat-hot" data-cat="4" style="left:431.5px"></span>
  <span class="cat-hot" data-cat="5" style="left:500.1px"></span>

  <div id="psyche-dots" class="dotrow baredots a" data-key="x.psyche" data-count="3" data-xs="357.7,411.5,467"></div>
  <div id="burst-dots"  class="dotrow baredots a" data-key="x.burst"  data-count="3" data-xs="645.1,710.9,778"></div>

  <!-- the ten sin boxes, centred on the printed white circles -->
  <span class="dot bare sindot a" data-key="x.sin.1"  style="left:460.6px;top:272.9px"></span>
  <span class="dot bare sindot a" data-key="x.sin.2"  style="left:770.6px;top:293.3px"></span>
  <span class="dot bare sindot a" data-key="x.sin.3"  style="left:702.2px;top:298.8px"></span>
  <span class="dot bare sindot a" data-key="x.sin.4"  style="left:600.4px;top:314.3px"></span>
  <span class="dot bare sindot a" data-key="x.sin.5"  style="left:658.6px;top:328.6px"></span>
  <span class="dot bare sindot a" data-key="x.sin.6"  style="left:500.2px;top:345.6px"></span>
  <span class="dot bare sindot a" data-key="x.sin.7"  style="left:731px;top:362.2px"></span>
  <span class="dot bare sindot a" data-key="x.sin.8"  style="left:578.3px;top:372.6px"></span>
  <span class="dot bare sindot a" data-key="x.sin.9"  style="left:646.2px;top:412.8px"></span>
  <span class="dot bare sindot a" data-key="x.sin.10" style="left:539.3px;top:417.8px"></span>

  <!-- registered kit -->
  <div id="kp-dots" class="dotrow baredots a" data-key="p2.kp" data-count="9" data-dashed-from="6"
       data-xs="171.3,199.5,228,256.3,283.3,313,342.3,370,399.3"></div>
  <div id="kit-list" class="ce area a" data-key="p2.kit" data-ph=""
       data-default="SERVICE WEAPONS (2 KP) (CAT 0, upgrade +1 by spending 3 scrip to max of CAT 3)
ISSUE UNIFORM (0 KP)
NOTEBOOK, PEN (1 KP)
MATCHBOOK (20 MATCHES), CLEAN HANDKERCHIEF (1 KP)"></div>
  <span id="scrip" class="ce line a" data-key="p2.scrip"></span>

  <!-- sin marks: worm (upper), bee (bottom left), fly (bottom right) -->
  <div id="mark-worm" class="mark ce area a" data-key="p2.mark.1" data-ph=""></div>
  <div id="mark-bee"  class="mark ce area a" data-key="p2.mark.2" data-ph=""></div>
  <div id="mark-fly"  class="mark ce area a" data-key="p2.mark.3" data-ph=""></div>
</section>

<!-- ===================== PAGE 3 ===================== -->
<section class="sheet" id="page3">
  <img class="page-art" src="assets/art/page-3.webp" alt="Exorcist sheet page 3: registered abilities, agenda, blasphemy, passive, observed powers">

  <div class="ac" id="f-agenda"    data-key="p3.agenda"    data-ac="agenda"></div>
  <div class="ac" id="f-blasphemy" data-key="p3.blasphemy" data-ac="blasphemy"></div>

  <div class="box ce area a" id="b-items"     data-key="p3.agenda.items"></div>
  <div class="box ce area a" id="b-abilities" data-key="p3.agenda.abilities"></div>
  <div class="box ce area a" id="b-passive"   data-key="p3.passive"></div>
  <span class="tick bare tcell" data-key="p3.passive.t1" style="left:291.3px;width:32px"></span>
  <span class="tick bare tcell" data-key="p3.passive.t2" style="left:323.3px;width:31.7px"></span>
  <span class="tick bare tcell" data-key="p3.passive.t3" style="left:355px;width:34.3px"></span>

  <div class="box ce area a" id="b-p1" data-key="p3.power.1"></div>
  <div class="box ce area a" id="b-p2" data-key="p3.power.2"></div>
  <div class="box ce area a" id="b-p3" data-key="p3.power.3"></div>
  <div class="box ce area a" id="b-p4" data-key="p3.power.4"></div>
  <div class="box ce area a" id="b-p5" data-key="p3.power.5"></div>
</section>

<!-- ===================== PAGE 4 ===================== -->
<section class="sheet" id="page4">
  <img class="page-art" src="assets/art/page-4.webp" alt="Exorcist sheet page 4: category reference chart, CAT 0 to VII by people, size, area, range, speed and magnitude">
  <div id="cat-col" class="a"></div>
</section>

<div id="site-footer">
  Fan-made interactive exorcist sheet — not official. CAIN is by Tom Bloom; sheet art from CAINsheets 1.4.5.<br>
  Everything autosaves in this browser. EXPORT for a portable backup.<br>
  Right-click a sin box to cross it out for good. Right-click the execution strip to undo a slash.
</div>

<script src="app.js"></script>
</body>
</html>
